<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>轶安安 · 工会智能助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

  body {
    font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #e8f4fd 0%, #f0f8ff 50%, #e0f0ff 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .container {
    width: 100vw;
    height: 100vh;
    max-width: 1400px;
    display: flex;
    position: relative;
    overflow: hidden;
  }

  /* ===== 左侧：人物区域 ===== */
  .left-panel {
    flex: 0 0 60%;
    position: relative;
    overflow: hidden;
  }

  .header-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 10;
    text-align: center;
    padding: 18px 20px 10px;
    background: linear-gradient(180deg, rgba(255,255,255,0.93) 0%, rgba(255,255,255,0.65) 70%, transparent 100%);
    pointer-events: none;
  }

  .header-bar h1 {
    font-size: 2rem;
    font-weight: 700;
    color: #d4380d;
    letter-spacing: 6px;
    text-shadow: 0 1px 3px rgba(212,56,13,0.15);
  }

  .header-bar .subtitle {
    font-size: 0.95rem;
    color: #888;
    letter-spacing: 3px;
    margin-top: 4px;
    font-weight: 300;
  }

  .character-wrapper {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .character-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 45%;
  }

  /* 角色动画层 */
  .character-anim-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* 呼吸动画 */
  .character-anim-layer.idle .body-layer {
    animation: bodyBreathe 4s ease-in-out infinite;
  }

  @keyframes bodyBreathe {
    0%, 100% { transform: scale(1) translateY(0); }
    50% { transform: scale(1.005) translateY(-2px); }
  }

  /* 眨眼动画 */
  .eye-layer {
    position: absolute;
    left: 0; top: 0;
    width: 100%; height: 100%;
    opacity: 0;
    animation: blink 5s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 92%, 100% { opacity: 0; }
    95%, 97% { opacity: 1; }
  }

  /* ===== 对话气泡 ===== */
  .bubble {
    position: absolute;
    z-index: 20;
    background: rgba(255,255,255,0.96);
    border: 2px solid #e74c3c;
    border-radius: 16px;
    padding: 14px 18px;
    font-size: 0.88rem;
    line-height: 1.75;
    color: #333;
    max-width: 28%;
    max-height: 50vh;
    word-break: break-all;
    opacity: 0;
    transform: scale(0.95);
    transition: opacity 0.12s ease, transform 0.12s ease;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08), 0 1px 4px rgba(231,76,60,0.1);
    overflow-y: auto;
    overflow-x: hidden;
    pointer-events: auto;
  }

  .bubble.visible {
    opacity: 1;
    transform: scale(1);
  }

  .bubble-left {
    left: 1.5%;
    top: 14%;
    width: 28%;
    max-width: 28%;
    bottom: 45%;
  }

  .bubble-right {
    right: 1.5%;
    top: 14%;
    width: 28%;
    max-width: 28%;
    bottom: 45%;
  }

  .bubble::-webkit-scrollbar { width: 3px; }
  .bubble::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

  /* 打字机效果（气泡内 + 聊天消息内通用） */
  .tw-char {
    display: inline;
    opacity: 0;
    transition: opacity 0.03s;
  }
  .tw-char.visible {
    opacity: 1;
  }
  .tw-char.active-char {
    color: #d4380d;
    font-weight: 600;
  }
  .bubble .tw-cursor {
    display: inline-block;
    width: 2px;
    height: 1.1em;
    background: #d4380d;
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: cursorBlink 0.6s step-end infinite;
  }
  @keyframes cursorBlink {
    50% { opacity: 0; }
  }

  /* ===== 右侧：聊天区域 ===== */
  .right-panel {
    flex: 0 0 40%;
    display: flex;
    flex-direction: column;
    background: rgba(255,255,255,0.92);
    border-left: 1px solid rgba(0,0,0,0.06);
    backdrop-filter: blur(10px);
  }

  .chat-header {
    padding: 20px 24px 14px;
    border-bottom: 1px solid #f0f0f0;
  }

  .chat-header h2 { font-size: 1.1rem; color: #333; font-weight: 500; }
  .chat-header p { font-size: 0.78rem; color: #999; margin-top: 3px; }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

  .message {
    max-width: 92%;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 0.9rem;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
    animation: msgIn 0.3s ease;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user {
    align-self: flex-end;
    background: linear-gradient(135deg, #d4380d, #e85d2e);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .message.bot {
    align-self: flex-start;
    background: #f5f5f5;
    color: #333;
    border-bottom-left-radius: 4px;
  }

  /* 聊天区内的菜单按钮 */
  .chat-menu-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
  }

  .chat-menu-btn {
    padding: 10px 16px;
    border: 1.5px solid #d4380d;
    border-radius: 12px;
    background: #fff;
    color: #d4380d;
    font-size: 0.88rem;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s;
    font-family: inherit;
  }

  .chat-menu-btn:hover {
    background: #d4380d;
    color: #fff;
    transform: translateX(4px);
  }

  /* ===== 快捷按钮栏 ===== */
  .quick-bar {
    padding: 10px 16px 2px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    border-top: 1px solid #f0f0f0;
  }

  .quick-btn {
    padding: 7px 14px;
    border: 1.5px solid #d4380d;
    border-radius: 18px;
    background: #fff;
    color: #d4380d;
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    white-space: nowrap;
  }

  .quick-btn:hover {
    background: #d4380d;
    color: #fff;
  }

  .chat-input-area {
    padding: 10px 20px 16px;
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .chat-input-area input {
    flex: 1;
    padding: 12px 16px;
    border: 1.5px solid #e0e0e0;
    border-radius: 24px;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
    background: #fafafa;
  }

  .chat-input-area input:focus { border-color: #d4380d; background: #fff; }

  .btn-send {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #d4380d, #e85d2e);
    color: #fff;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s, box-shadow 0.15s;
    flex-shrink: 0;
  }

  .btn-send:hover { transform: scale(1.05); box-shadow: 0 3px 12px rgba(212,56,13,0.3); }

  .btn-stop {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1.5px solid #d4380d;
    background: #fff;
    color: #d4380d;
    font-size: 1.1rem;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .btn-stop.playing { display: flex; }
  .btn-stop:hover { background: #d4380d; color: #fff; }

  /* ===== 响应式 ===== */
  @media (max-width: 768px) {
    body { overflow: auto; }
    .container {
      flex-direction: column;
      height: 100dvh;
    }
    .left-panel {
      flex: 0 0 35vh;
      min-height: 200px;
    }
    .header-bar { padding: 10px 12px 6px; }
    .header-bar h1 { font-size: 1.3rem; letter-spacing: 3px; }
    .header-bar .subtitle { font-size: 0.72rem; letter-spacing: 1px; }
    .right-panel {
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    .chat-header { padding: 10px 14px 8px; }
    .chat-header h2 { font-size: 0.95rem; }
    .chat-header p { font-size: 0.7rem; }
    .chat-messages { padding: 10px 14px; gap: 10px; }
    .message { font-size: 0.85rem; padding: 10px 14px; }
    /* 手机端气泡：移到聊天区上方，不遮人物 */
    .bubble { max-width: 40%; font-size: 0.75rem; padding: 8px 12px; }
    .bubble-left, .bubble-right { left: auto; right: 2%; top: 4px; width: 36%; max-height: 28vh; }
    .quick-bar { padding: 6px 10px 2px; gap: 6px; }
    .quick-btn { font-size: 0.72rem; padding: 5px 10px; }
    .chat-input-area { padding: 8px 12px 12px; }
    .chat-input-area input { padding: 10px 14px; font-size: 0.85rem; }
    .btn-send, .btn-stop { width: 38px; height: 38px; font-size: 1rem; }
  }
  @media (max-width: 380px) {
    .left-panel { flex: 0 0 28vh; min-height: 160px; }
    .header-bar h1 { font-size: 1.1rem; letter-spacing: 2px; }
  }
</style>
</head>
<body>

<div class="container">
  <!-- 左侧：人物 + 气泡 -->
  <div class="left-panel">
    <div class="header-bar">
      <h1>安安 · 工会智能助手</h1>
      <div class="subtitle">维权帮扶 · 关爱职工 · 凝心聚力</div>
    </div>
    <div class="character-wrapper">
      <img class="character-img" src="character.png" alt="安安">
      <div class="character-anim-layer idle">
        <div class="eye-layer"></div>
      </div>
    </div>
    <div class="bubble bubble-left" id="bubbleLeft"></div>
    <div class="bubble bubble-right" id="bubbleRight"></div>
  </div>

  <!-- 右侧：聊天 -->
  <div class="right-panel">
    <div class="chat-header">
      <h2>💬 与轶安安对话</h2>
      <p>基于中铁二局工会文件知识库 · 154条专业问答</p>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="message bot">你好！我是轶安安，中铁二局工会智能助手 🌸
我可以帮你查询工会福利、关爱服务、帮扶救助、财务管理等政策。

试试问我：
• 工会有哪些福利？
• 三不让是什么？
• 结婚有什么慰问？
• 工会经费怎么管理？</div>
    </div>
    <div class="quick-bar" id="quickBar">
      <button class="quick-btn" data-q="职业生涯关爱">职业生涯关爱</button>
      <button class="quick-btn" data-q="财务管理办法">财务管理办法</button>
      <button class="quick-btn" data-q="三不让帮扶救助">三不让帮扶救助</button>
      <button class="quick-btn" data-q="工会福利">工会福利</button>
    </div>
    <div class="chat-input-area">
      <button class="btn-stop" id="btnStop" title="暂停播报">⏸</button>
      <input type="text" id="userInput" placeholder="输入你的问题…" autocomplete="off">
      <button class="btn-send" id="btnSend" title="发送">▶</button>
    </div>
  </div>
</div>

<script>
const API_BASE = 'https://web-production-55858.up.railway.app';
const bubbleLeft = document.getElementById('bubbleLeft');
const bubbleRight = document.getElementById('bubbleRight');
const chatMessages = document.getElementById('chatMessages');
const userInput = document.getElementById('userInput');
const btnSend = document.getElementById('btnSend');
const btnStop = document.getElementById('btnStop');
const quickBar = document.getElementById('quickBar');

let currentAudio = null;
let typingRafId = null;

// ===== 快捷按钮 =====
quickBar.addEventListener('click', (e) => {
  const btn = e.target.closest('.quick-btn');
  if (!btn) return;
  userInput.value = btn.dataset.q;
  sendMsg();
});

// ===== 暂停播报按钮 =====
btnStop.addEventListener('click', () => stopPlayback());

// ===== 双击页面暂停 + 显示全部文字 =====
let pendingFullText = null;
function stopPlayback() {
  if (currentAudio) { currentAudio.pause(); currentAudio.remove(); currentAudio = null; }
  if (typingRafId) { cancelAnimationFrame(typingRafId); typingRafId = null; }
  btnStop.classList.remove('playing');

  // 如果有待显示的完整文本，立即在聊天面板中显示
  if (pendingFullText) {
    hideBubbles();
    const div = document.createElement('div');
    div.className = 'message bot';
    div.textContent = pendingFullText;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    pendingFullText = null;
  } else {
    hideBubbles();
  }
}

document.addEventListener('dblclick', (e) => {
  // 避免在按钮/输入框上双击触发
  if (e.target.closest('.chat-input-area, .quick-bar, .chat-menu-btn')) return;
  if (pendingFullText || currentAudio) {
    stopPlayback();
  }
});

// ===== 隐藏气泡 =====
function hideBubbles() {
  bubbleLeft.classList.remove('visible');
  bubbleRight.classList.remove('visible');
  bubbleLeft.innerHTML = '';
  bubbleRight.innerHTML = '';
  bubbleLeft.className = 'bubble bubble-left';
  bubbleRight.className = 'bubble bubble-right';
  if (typingRafId) { cancelAnimationFrame(typingRafId); typingRafId = null; }
}

/**
 * 手机端：在聊天面板内逐字显示 + 打字机效果（不使用气泡）
 */
function startChatTyping(text, onDone) {
  const msg = document.createElement('div');
  msg.className = 'message bot';
  const inner = document.createElement('span');
  inner.style.cssText = 'white-space:pre-wrap;';
  msg.appendChild(inner);
  const cursor = document.createElement('span');
  cursor.className = 'tw-cursor';
  msg.appendChild(cursor);
  chatMessages.appendChild(msg);
  chatMessages.scrollTop = chatMessages.scrollHeight;

  const chars = [];
  for (const ch of text) {
    const s = document.createElement('span');
    s.className = 'tw-char';
    s.textContent = ch;
    inner.appendChild(s);
    chars.push(s);
  }

  let charIdx = 0;
  let lastT = performance.now();

  function tick(now) {
    const dt = now - lastT;
    if (dt >= 80) {
      const steps = Math.floor(dt / 80);
      for (let i = 0; i < steps && charIdx < chars.length; i++) {
        chars[charIdx].classList.add('visible');
        if (charIdx > 0) chars[charIdx - 1].classList.remove('active-char');
        chars[charIdx].classList.add('active-char');
        charIdx++;
      }
      lastT = now - (dt % 80);
    }
    if (charIdx < chars.length) {
      typingRafId = requestAnimationFrame(tick);
    } else {
      typingRafId = null;
      if (chars.length) chars[chars.length - 1].classList.remove('active-char');
      cursor.remove();
      onDone();
    }
  }
  typingRafId = requestAnimationFrame(tick);
}

// ===== 发送消息 =====
async function sendMsg() {
  const text = userInput.value.trim();
  if (!text) return;
  userInput.value = '';

  addChatMsg(text.replace(/^__ENTRY__:[^:]+:/, ''), 'user');
  const loading = addChatMsg('安安正在查找…', 'bot');

  try {
    const resp = await fetch(`${API_BASE}/api/ask?question=${encodeURIComponent(text)}`);
    const data = await resp.json();
    loading.remove();

    if (!data.success || !data.answer) {
      addChatMsg('抱歉，未找到相关信息。', 'bot');
      return;
    }

    // 菜单/澄清类型 → 右侧聊天面板显示可点击按钮
    if ((data.type === 'menu' || data.type === 'clarify') && data.menu_items?.length) {
      const botDiv = addChatMsg('', 'bot');
      botDiv.textContent = data.answer.split('\n')[0];

      const menuDiv = document.createElement('div');
      menuDiv.className = 'chat-menu-options';
      for (const item of data.menu_items) {
        const btn = document.createElement('button');
        btn.className = 'chat-menu-btn';
        btn.textContent = item.label;
        btn.addEventListener('click', () => {
          userInput.value = item.key ? `__ENTRY__:${item.key}:${item.label}` : item.label;
          sendMsg();
        });
        menuDiv.appendChild(btn);
      }
      botDiv.appendChild(menuDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return;
    }

    // 详情类型 → 左侧气泡打字机 + 后端 TTS 音频
    showBubbleTyping(data.answer);

  } catch (err) {
    loading.remove();
    addChatMsg(`网络连接失败: ${err.message}`, 'bot');
  }
}

/**
 * 左侧气泡逐字显示 + 后端 TTS 温柔女声播报
 */
function showBubbleTyping(text) {
  const MAX_PER_SIDE = 180;
  const paragraphs = text.split('\n').filter(p => p.trim());
  const rounds = [];
  let buf = '';
  for (const para of paragraphs) {
    if (buf.length < 30 && para.trim() === buf.replace(/[【】\[\]]/g, '').trim()) {
      buf = para;
      continue;
    }
    if (buf && (buf.length + para.length + 1) > MAX_PER_SIDE) {
      rounds.push(buf.trim());
      buf = para;
    } else {
      buf += (buf ? '\n' : '') + para;
    }
  }
  if (buf.trim()) rounds.push(buf.trim());
  if (rounds.length > 1 && rounds[0].length < 30) {
    rounds[0] = rounds[0] + '\n' + rounds[1];
    rounds.splice(1, 1);
  }
  if (!rounds.length) rounds.push(text);

  if (currentAudio) { currentAudio.pause(); currentAudio.remove(); currentAudio = null; }
  if (typingRafId) { cancelAnimationFrame(typingRafId); typingRafId = null; }
  hideBubbles();

  btnStop.classList.add('playing');
  pendingFullText = text;

  // 手机端：直接在聊天面板内打字显示，不用气泡
  if (window.innerWidth <= 768) {
    const msg = document.createElement('div');
    msg.className = 'message bot';
    chatMessages.appendChild(msg);
    chatMessages.scrollTop = chatMessages.scrollHeight;

    const audio = new Audio();
    currentAudio = audio;
    fetch(`${API_BASE}/api/tts?text=${encodeURIComponent(text)}`)
      .then(r => r.blob())
      .then(blob => {
        audio.src = URL.createObjectURL(blob);
        audio.play().catch(() => {});
      })
      .catch(() => {});

    startChatTyping(text, () => {
      setTimeout(() => { hideBubbles(); }, 1500);
      if (currentAudio) { currentAudio.remove(); currentAudio = null; }
      btnStop.classList.remove('playing');
      pendingFullText = null;
    });
    return;
  }

  const audio = new Audio();
  currentAudio = audio;

  let roundIdx = 0;

  function playRound() {
    if (roundIdx >= rounds.length) {
      setTimeout(() => { hideBubbles(); }, 1500);
      if (currentAudio) { currentAudio.remove(); currentAudio = null; }
      btnStop.classList.remove('playing');
      pendingFullText = null;
      return;
    }

    const rText = rounds[roundIdx];
    const side = roundIdx % 2 === 0 ? 'left' : 'right';
    hideBubbles();

    const bubble = side === 'left' ? bubbleLeft : bubbleRight;

    const innerDiv = document.createElement('div');
    innerDiv.style.cssText = 'position:relative;';
    bubble.appendChild(innerDiv);
    bubble.classList.add('visible');

    const charSpans = [];
    for (let i = 0; i < rText.length; i++) {
      const cs = document.createElement('span');
      cs.className = 'tw-char';
      cs.textContent = rText[i];
      innerDiv.appendChild(cs);
      charSpans.push(cs);
    }
    const cursor = document.createElement('span');
    cursor.className = 'tw-cursor';
    innerDiv.appendChild(cursor);

    // 用 requestAnimationFrame 驱动的打字动画（手机端不会被限流）
    let done = false;
    const onDone = () => {
      if (done) return;
      done = true;
      roundIdx++;
      setTimeout(playRound, 600);
    };

    startTypingRAF(charSpans, cursor, innerDiv, bubble, 100, onDone);

    // 同时请求 TTS 音频
    fetch(`${API_BASE}/api/tts?text=${encodeURIComponent(rText)}`)
      .then(r => r.blob())
      .then(blob => {
        audio.src = URL.createObjectURL(blob);
        audio.play().catch(() => {});
      })
      .catch(() => {});
  }

  playRound();
}

/**
 * 基于 requestAnimationFrame 的打字动画（替代 setTimeout，手机端流畅）
 * 单个 rAF 循环驱动所有字符显示，不会创建数百个定时器
 */
function startTypingRAF(spans, cursor, container, bubble, msPerChar, onDone) {
  if (typingRafId) {
    cancelAnimationFrame(typingRafId);
    typingRafId = null;
  }

  const cancelFlag = { cancelled: false };
  let charIndex = 0;
  let lastTime = performance.now();

  function tick(now) {
    if (cancelFlag.cancelled) return;

    const delta = now - lastTime;
    if (delta >= msPerChar) {
      const steps = Math.floor(delta / msPerChar);
      for (let s = 0; s < steps && charIndex < spans.length; s++) {
        spans[charIndex].classList.add('visible');
        if (charIndex > 0) spans[charIndex - 1].classList.remove('active-char');
        spans[charIndex].classList.add('active-char');
        charIndex++;
      }
      lastTime = now - (delta % msPerChar);

      if (container.parentNode) {
        container.appendChild(cursor);
      }
      if (bubble.scrollHeight > bubble.clientHeight) {
        bubble.scrollTop = bubble.scrollHeight;
      }
    }

    if (charIndex < spans.length) {
      typingRafId = requestAnimationFrame(tick);
    } else {
      typingRafId = null;
      if (spans.length > 0) spans[spans.length - 1].classList.remove('active-char');
      cursor.remove();
      onDone();
    }
  }

  typingRafId = requestAnimationFrame(tick);
}

function addChatMsg(text, type) {
  const div = document.createElement('div');
  div.className = 'message ' + type;
  div.textContent = text;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  return div;
}

// ===== 事件绑定 =====
btnSend.addEventListener('click', sendMsg);
userInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });
</script>
