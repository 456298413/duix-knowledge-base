<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>轶安安 · 工会智能助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

  body {
    font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #e8f4fd 0%, #f0f8ff 50%, #e0f0ff 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .container {
    width: 100vw;
    height: 100vh;
    max-width: 1400px;
    display: flex;
    position: relative;
    overflow: hidden;
  }

  /* ===== 左侧：人物区域 ===== */
  .left-panel {
    flex: 0 0 60%;
    position: relative;
    overflow: hidden;
  }

  .header-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 10;
    text-align: center;
    padding: 18px 20px 10px;
    background: linear-gradient(180deg, rgba(255,255,255,0.93) 0%, rgba(255,255,255,0.65) 70%, transparent 100%);
    pointer-events: none;
  }

  .header-bar h1 {
    font-size: 2rem;
    font-weight: 700;
    color: #d4380d;
    letter-spacing: 6px;
    text-shadow: 0 1px 3px rgba(212,56,13,0.15);
  }

  .header-bar .subtitle {
    font-size: 0.95rem;
    color: #888;
    letter-spacing: 3px;
    margin-top: 4px;
    font-weight: 300;
  }

  .character-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 45%;
  }

  /* ===== 对话气泡 ===== */
  .bubble {
    position: absolute;
    z-index: 20;
    background: rgba(255,255,255,0.96);
    border: 2px solid #e74c3c;
    border-radius: 16px;
    padding: 14px 18px;
    font-size: 0.88rem;
    line-height: 1.75;
    color: #333;
    max-width: 15%;
    max-height: 50vh;
    word-break: break-all;
    opacity: 0;
    transform: scale(0.85);
    transition: opacity 0.35s ease, transform 0.35s ease;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08), 0 1px 4px rgba(231,76,60,0.1);
    overflow-y: auto;
    overflow-x: hidden;
    pointer-events: auto;
  }

  .bubble.visible {
    opacity: 1;
    transform: scale(1);
  }

  .bubble-left {
    left: 1.5%;
    top: 14%;
    width: 28%;
    max-width: 28%;
    bottom: 45%;
  }

  .bubble-right {
    right: 1.5%;
    top: 14%;
    width: 28%;
    max-width: 28%;
    bottom: 45%;
  }

  .bubble::-webkit-scrollbar { width: 3px; }
  .bubble::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

  /* 打字机效果 */
  .bubble .tw-char {
    display: inline;
    opacity: 0;
    transition: opacity 0.08s;
  }
  .bubble .tw-char.visible {
    opacity: 1;
  }
  .bubble .tw-char.active-char {
    color: #d4380d;
    font-weight: 600;
  }
  .bubble .tw-cursor {
    display: inline-block;
    width: 2px;
    height: 1.1em;
    background: #d4380d;
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 0.6s step-end infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }

  /* 气泡溢出滚动动画 */
  .bubble.scrolling-text {
    animation: bubbleScroll linear infinite;
    animation-play-state: paused;
  }
  .bubble.scrolling-text.do-scroll {
    animation-play-state: running;
  }
  @keyframes bubbleScroll {
    0%   { transform: translateY(0); }
    100% { transform: translateY(-100%); }
  }

  /* ===== 粒子特效 ===== */
  .particle-container {
    position: absolute;
    z-index: 15;
    pointer-events: none;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    animation: particleFloat 2s ease-out forwards;
  }

  @keyframes particleFloat {
    0% { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); }
  }

  /* ===== 轮次指示器 ===== */
  .round-dots {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 5px;
    z-index: 25;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .round-dots.visible { opacity: 1; }

  .round-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #ddd;
    transition: background 0.3s;
  }

  .round-dot.active { background: #d4380d; }

  /* ===== 右侧：聊天区域 ===== */
  .right-panel {
    flex: 0 0 40%;
    display: flex;
    flex-direction: column;
    background: rgba(255,255,255,0.92);
    border-left: 1px solid rgba(0,0,0,0.06);
    backdrop-filter: blur(10px);
  }

  .chat-header {
    padding: 20px 24px 14px;
    border-bottom: 1px solid #f0f0f0;
  }

  .chat-header h2 { font-size: 1.1rem; color: #333; font-weight: 500; }
  .chat-header p { font-size: 0.78rem; color: #999; margin-top: 3px; }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

  .message {
    max-width: 92%;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 0.9rem;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
    animation: msgIn 0.3s ease;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user {
    align-self: flex-end;
    background: linear-gradient(135deg, #d4380d, #e85d2e);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .message.bot {
    align-self: flex-start;
    background: #f5f5f5;
    color: #333;
    border-bottom-left-radius: 4px;
  }

  .message.bot .source-tag {
    display: inline-block;
    font-size: 0.72rem;
    color: #999;
    background: #eee;
    padding: 2px 8px;
    border-radius: 10px;
    margin-top: 8px;
  }

  /* 聊天区内的菜单按钮 */
  .chat-menu-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
  }

  .chat-menu-btn {
    padding: 10px 16px;
    border: 1.5px solid #d4380d;
    border-radius: 12px;
    background: #fff;
    color: #d4380d;
    font-size: 0.88rem;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s;
    font-family: inherit;
  }

  .chat-menu-btn:hover {
    background: #d4380d;
    color: #fff;
    transform: translateX(4px);
  }

  /* ===== 快捷按钮栏 ===== */
  .quick-bar {
    padding: 10px 16px 2px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    border-top: 1px solid #f0f0f0;
  }

  .quick-btn {
    padding: 7px 14px;
    border: 1.5px solid #d4380d;
    border-radius: 18px;
    background: #fff;
    color: #d4380d;
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    white-space: nowrap;
  }

  .quick-btn:hover {
    background: #d4380d;
    color: #fff;
  }

  .chat-input-area {
    padding: 10px 20px 16px;
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .chat-input-area input {
    flex: 1;
    padding: 12px 16px;
    border: 1.5px solid #e0e0e0;
    border-radius: 24px;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
    background: #fafafa;
  }

  .chat-input-area input:focus { border-color: #d4380d; background: #fff; }

  .btn-send {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #d4380d, #e85d2e);
    color: #fff;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s, box-shadow 0.15s;
    flex-shrink: 0;
  }

  .btn-send:hover { transform: scale(1.05); box-shadow: 0 3px 12px rgba(212,56,13,0.3); }

  .btn-voice {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1.5px solid #ddd;
    background: #fff;
    color: #666;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .btn-voice:hover { border-color: #d4380d; color: #d4380d; }
  .btn-voice.recording { background: #d4380d; color: #fff; border-color: #d4380d; animation: pulse 1s infinite; }

  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(212,56,13,0.4); }
    50% { box-shadow: 0 0 0 10px rgba(212,56,13,0); }
  }

  /* ===== 响应式 ===== */
  @media (max-width: 768px) {
    body { overflow: auto; }
    .container {
      flex-direction: column;
      height: 100dvh;
    }
    .left-panel {
      flex: 0 0 35vh;
      min-height: 200px;
    }
    .header-bar { padding: 10px 12px 6px; }
    .header-bar h1 { font-size: 1.3rem; letter-spacing: 3px; }
    .header-bar .subtitle { font-size: 0.72rem; letter-spacing: 1px; }
    .right-panel {
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    .chat-header { padding: 10px 14px 8px; }
    .chat-header h2 { font-size: 0.95rem; }
    .chat-header p { font-size: 0.7rem; }
    .chat-messages { padding: 10px 14px; gap: 10px; }
    .message { font-size: 0.85rem; padding: 10px 14px; }
    .bubble { max-width: 40%; font-size: 0.75rem; padding: 8px 12px; }
    .bubble-left { left: 2%; top: 10%; width: 40%; bottom: 50%; }
    .bubble-right { right: 2%; top: 10%; width: 40%; bottom: 50%; }
    .quick-bar { padding: 6px 10px 2px; gap: 6px; }
    .quick-btn { font-size: 0.72rem; padding: 5px 10px; }
    .chat-input-area { padding: 8px 12px 12px; }
    .chat-input-area input { padding: 10px 14px; font-size: 0.85rem; }
    .btn-send, .btn-voice { width: 38px; height: 38px; font-size: 1rem; }
  }
  /* 超小屏 */
  @media (max-width: 380px) {
    .left-panel { flex: 0 0 28vh; min-height: 160px; }
    .header-bar h1 { font-size: 1.1rem; letter-spacing: 2px; }
  }
</style>
</head>
<body>

<div class="container">
  <!-- 左侧：人物 + 气泡 -->
  <div class="left-panel">
    <div class="header-bar">
      <h1>安安 · 工会智能助手</h1>
      <div class="subtitle">维权帮扶 · 关爱职工 · 凝心聚力</div>
    </div>
    <img class="character-img" src="character.png" alt="安安">

    <div class="bubble bubble-left" id="bubbleLeft"></div>
    <div class="bubble bubble-right" id="bubbleRight"></div>
    <div class="particle-container" id="particleContainer"></div>
    <div class="round-dots" id="roundDots"></div>
  </div>

  <!-- 右侧：聊天 -->
  <div class="right-panel">
    <div class="chat-header">
      <h2>💬 与轶安安对话</h2>
      <p>基于中铁二局工会文件知识库 · 154条专业问答</p>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="message bot">你好！我是轶安安，中铁二局工会智能助手 🌸
我可以帮你查询工会福利、关爱服务、帮扶救助、财务管理等政策。

试试问我：
• 工会有哪些福利？
• 三不让是什么？
• 结婚有什么慰问？
• 工会经费怎么管理？</div>
    </div>
    <div class="quick-bar" id="quickBar">
      <button class="quick-btn" data-q="职业生涯关爱">职业生涯关爱</button>
      <button class="quick-btn" data-q="财务管理办法">财务管理办法</button>
      <button class="quick-btn" data-q="三不让帮扶救助">三不让帮扶救助</button>
      <button class="quick-btn" data-q="工会福利">工会福利</button>
    </div>
    <div class="chat-input-area">
      <button class="btn-voice" id="btnVoice" title="语音输入">🎤</button>
      <input type="text" id="userInput" placeholder="输入你的问题…" autocomplete="off">
      <button class="btn-send" id="btnSend" title="发送">▶</button>
    </div>
  </div>
</div>

<script>
const API_BASE = 'https://web-production-55858.up.railway.app';
const bubbleLeft = document.getElementById('bubbleLeft');
const bubbleRight = document.getElementById('bubbleRight');
const chatMessages = document.getElementById('chatMessages');
const userInput = document.getElementById('userInput');
const btnSend = document.getElementById('btnSend');
const btnVoice = document.getElementById('btnVoice');
const particleContainer = document.getElementById('particleContainer');
const roundDots = document.getElementById('roundDots');
const quickBar = document.getElementById('quickBar');

let isSpeaking = false;
let particleTimer = null;
let recognition = null;
let charTimers = [];
let scrollAnimId = null;
// pendingUtter 已废弃，改用 currentUtter（在 sendMsg 中同步创建并立即 speak）

// ===== 快捷按钮 =====
quickBar.addEventListener('click', (e) => {
  const btn = e.target.closest('.quick-btn');
  if (!btn) return;
  userInput.value = btn.dataset.q;
  sendMsg();
});

// ===== 语音识别 =====
function initRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { btnVoice.style.display = 'none'; return; }
  recognition = new SR();
  recognition.lang = 'zh-CN';
  recognition.continuous = false;
  recognition.onstart = () => btnVoice.classList.add('recording');
  recognition.onend = () => btnVoice.classList.remove('recording');
  recognition.onresult = e => { userInput.value = e.results[0][0].transcript; sendMsg(); };
  recognition.onerror = () => btnVoice.classList.remove('recording');
}

btnVoice.addEventListener('click', () => {
  if (!recognition) return;
  btnVoice.classList.contains('recording') ? recognition.stop() : recognition.start();
});

// ===== 粒子特效 =====
function startParticles() {
  if (particleTimer) return;
  particleTimer = setInterval(() => {
    for (let i = 0; i < 3; i++) createParticle();
  }, 80);
}

function stopParticles() {
  clearInterval(particleTimer);
  particleTimer = null;
}

function createParticle() {
  const p = document.createElement('div');
  p.className = 'particle';
  const size = Math.random() * 6 + 3;
  const colors = ['#ffd700','#ff6b6b','#87ceeb','#98fb98','#dda0dd','#f0e68c'];
  const color = colors[Math.floor(Math.random() * colors.length)];
  const active = bubbleLeft.classList.contains('visible') ? bubbleLeft : bubbleRight;
  const rect = active.getBoundingClientRect();
  const cRect = particleContainer.getBoundingClientRect();
  const cx = rect.left - cRect.left + rect.width/2 + (Math.random()-0.5)*rect.width*0.8;
  const cy = rect.top - cRect.top + rect.height/2 + (Math.random()-0.5)*rect.height*0.6;
  p.style.cssText = `width:${size}px;height:${size}px;background:${color};left:${cx}px;top:${cy}px;--dx:${(Math.random()-0.5)*120}px;--dy:${(Math.random()-0.5)*120-30}px;`;
  particleContainer.appendChild(p);
  setTimeout(() => p.remove(), 2000);
}

// ===== 隐藏气泡 =====
function hideBubbles() {
  bubbleLeft.classList.remove('visible');
  bubbleRight.classList.remove('visible');
  bubbleLeft.innerHTML = '';
  bubbleRight.innerHTML = '';
  bubbleLeft.className = 'bubble bubble-left';
  bubbleRight.className = 'bubble bubble-right';
  roundDots.classList.remove('visible');
  roundDots.innerHTML = '';
  charTimers.forEach(t => clearTimeout(t));
  charTimers = [];
  if (scrollAnimId) { cancelAnimationFrame(scrollAnimId); scrollAnimId = null; }
}

// ===== 语音播报 + 打字机逐字出现 =====
// warmVoice: 如果传入了在手势上下文中创建的语音对象，复用它（不cancel）
function speakAndShow(text, warmVoice) {
  // 只有非 warmVoice 模式才 cancel，避免打断手势上下文中的语音
  if (!warmVoice) {
    window.speechSynthesis.cancel();
  }
  hideBubbles();
  stopParticles();
  charTimers.forEach(t => clearTimeout(t));
  charTimers = [];
  if (scrollAnimId) { cancelAnimationFrame(scrollAnimId); scrollAnimId = null; }

  if (!text || !window.speechSynthesis) return;

  const MAX_PER_SIDE = 180;

  // 按段落切分轮次
  const paragraphs = text.split('\n').filter(p => p.trim());
  const rounds = [];
  let buf = '';
  for (const para of paragraphs) {
    if (buf && (buf.length + para.length + 1) > MAX_PER_SIDE) {
      rounds.push(buf.trim());
      buf = para;
    } else {
      buf += (buf ? '\n' : '') + para;
    }
  }
  if (buf.trim()) rounds.push(buf.trim());
  if (!rounds.length) rounds.push(text);

  let roundIdx = 0;

  // 轮次指示器
  if (rounds.length > 1) {
    roundDots.innerHTML = '';
    for (let i = 0; i < rounds.length; i++) {
      const d = document.createElement('div');
      d.className = 'round-dot' + (i === 0 ? ' active' : '');
      roundDots.appendChild(d);
    }
    roundDots.classList.add('visible');
  }

  // 获取语音
  function getVoice() {
    const voices = window.speechSynthesis.getVoices();
    const prefs = ['Microsoft Xiaoxiao','Xiaoxiao','Huihui','Microsoft Huihui','Google 普通话','Ting-Ting'];
    let voice = null;
    for (const name of prefs) {
      voice = voices.find(v => v.name.includes(name) && v.lang.startsWith('zh'));
      if (voice) break;
    }
    if (!voice) voice = voices.find(v => v.lang.startsWith('zh') && (v.name.includes('Female')||v.name.includes('女')));
    if (!voice) voice = voices.find(v => v.lang.startsWith('zh'));
    return voice;
  }

  const voice = getVoice();
  const SPEECH_RATE = 0.92;
  // 打字机速度：跟随语音节奏
  const MS_PER_CHAR = 1000 / (4.5 * SPEECH_RATE);

  function playRound() {
    if (roundIdx >= rounds.length) {
      setTimeout(() => { hideBubbles(); stopParticles(); roundDots.classList.remove('visible'); }, 1500);
      return;
    }

    const rText = rounds[roundIdx];
    const side = roundIdx % 2 === 0 ? 'left' : 'right';
    hideBubbles();

    const bubble = side === 'left' ? bubbleLeft : bubbleRight;

    // 创建容器，每个字符一个span
    const innerDiv = document.createElement('div');
    innerDiv.style.cssText = 'position:relative;';
    bubble.appendChild(innerDiv);
    bubble.classList.add('visible');

    // 逐字创建 span
    const charSpans = [];
    for (let i = 0; i < rText.length; i++) {
      const cs = document.createElement('span');
      cs.className = 'tw-char';
      cs.textContent = rText[i];
      innerDiv.appendChild(cs);
      charSpans.push(cs);
    }
    // 光标
    const cursor = document.createElement('span');
    cursor.className = 'tw-cursor';
    innerDiv.appendChild(cursor);

    // 更新轮次指示器
    const dots = roundDots.querySelectorAll('.round-dot');
    dots.forEach((d, i) => d.classList.toggle('active', i === roundIdx));

    isSpeaking = true;
    startParticles();

    // 检查是否需要滚动
    const totalHeight = innerDiv.scrollHeight;
    const visibleHeight = bubble.clientHeight;
    const needsScroll = totalHeight > visibleHeight;

    let currentChar = 0;
    let scrollProgress = 0; // 0~1

    // 滚动函数：从顶部慢慢滚到底部，循环
    function startAutoScroll() {
      if (!needsScroll) return;
      bubble.scrollTop = 0;
      const scrollDuration = charSpans.length * MS_PER_CHAR; // 与打字同步
      const startTime = performance.now();
      function step(now) {
        const elapsed = now - startTime;
        const progress = (elapsed % scrollDuration) / scrollDuration;
        const maxScroll = innerDiv.scrollHeight - bubble.clientHeight;
        bubble.scrollTop = progress * maxScroll;
        scrollAnimId = requestAnimationFrame(step);
      }
      scrollAnimId = requestAnimationFrame(step);
    }

    // 逐字显示定时器
    let elapsed = 0;
    for (let i = 0; i < charSpans.length; i++) {
      const t = setTimeout(() => {
        charSpans[i].classList.add('visible');
        // 高亮当前字
        if (i > 0) charSpans[i-1].classList.remove('active-char');
        charSpans[i].classList.add('active-char');
        // 光标跟随
        cursor.remove();
        innerDiv.appendChild(cursor);
        // 如果没有自动滚动，手动跟随滚动
        if (!needsScroll) {
          const cr = cursor.getBoundingClientRect();
          const br = bubble.getBoundingClientRect();
          if (cr.bottom > br.bottom - 10) {
            bubble.scrollTop += cr.bottom - br.bottom + 20;
          }
        }
      }, elapsed);
      charTimers.push(t);
      elapsed += MS_PER_CHAR;
    }

    // TTS 播报：第一轮复用预热语音对象（保持在手势上下文），后续轮次正常创建
    let utter;
    if (warmVoice && roundIdx === 0) {
      // 复用预创建对象——它是在手势上下文中创建的，手机上只有它能播放
      utter = warmVoice;
      utter.text = rText;
      // 重新设置 voice（预创建时 voices 可能还没加载好）
      if (voice) utter.voice = voice;
    } else {
      utter = new SpeechSynthesisUtterance(rText);
      utter.lang = 'zh-CN';
      utter.rate = SPEECH_RATE;
      utter.pitch = 1.1;
      if (voice) utter.voice = voice;
    }

    // 语音开始后启动自动滚动
    utter.onstart = () => { startAutoScroll(); };

    utter.onend = () => {
      isSpeaking = false;
      stopParticles();
      // 最后一个字也标记
      if (charSpans.length > 0) {
        charSpans[charSpans.length-1].classList.remove('active-char');
      }
      cursor.remove();
      if (scrollAnimId) { cancelAnimationFrame(scrollAnimId); scrollAnimId = null; }
      roundIdx++;
      if (roundIdx < rounds.length) {
        setTimeout(playRound, 600);
      } else {
        setTimeout(() => { hideBubbles(); roundDots.classList.remove('visible'); }, 1500);
      }
    };

    utter.onerror = () => {
      isSpeaking = false;
      stopParticles();
      cursor.remove();
      if (scrollAnimId) { cancelAnimationFrame(scrollAnimId); scrollAnimId = null; }
      hideBubbles();
    };

    // 确保引擎活跃后再 speak
    window.speechSynthesis.resume();
    window.speechSynthesis.speak(utter);

    // 兜底：200ms后如果还没开始播放，用全新 utterance 重试（覆盖部分手机浏览器场景）
    if (roundIdx === 0) {
      const onendRef = utter.onend;
      const onerrorRef = utter.onerror;
      setTimeout(() => {
        if (!window.speechSynthesis.speaking && !window.speechSynthesis.pending && isSpeaking) {
          // 主 utterance 没有成功播放，用 fallback 重试
          const fb = new SpeechSynthesisUtterance(rText);
          fb.lang = 'zh-CN';
          fb.rate = SPEECH_RATE;
          fb.pitch = 1.1;
          if (voice) fb.voice = voice;
          fb.onstart = () => {};
          fb.onend = onendRef;
          fb.onerror = onerrorRef;
          window.speechSynthesis.resume();
          window.speechSynthesis.speak(fb);
        }
      }, 200);
    }
  }

  playRound();
}

// ===== 发送消息 =====
// 关键：手机浏览器只允许在用户手势的同步代码中触发语音
// 所以必须在 fetch 之前就调用 speak()，利用浏览器的语音队列机制
let currentUtter = null; // 当前正在使用的语音对象

async function sendMsg() {
  const text = userInput.value.trim();
  if (!text) return;
  userInput.value = '';

  addChatMsg(text, 'user');
  const loading = addChatMsg('安安正在查找…', 'bot');

  // ===== 关键修复：在同步代码中立即触发语音 =====
  // 手机浏览器只允许在用户手势的同步代码中触发 TTS
  // 利用浏览器的语音队列机制：先入队的先播放
  if (window.speechSynthesis) {
    try {
      window.speechSynthesis.cancel(); // 清除之前的语音
      // 立即创建一个占位语音并 speak（在同步代码中！）
      // 它会被放入队列，等 API 响应回来后再用实际内容替换
      currentUtter = new SpeechSynthesisUtterance('正在查询');
      currentUtter.lang = 'zh-CN';
      currentUtter.rate = 0.92;
      currentUtter.pitch = 1.1;
      // 设置语音
      const voices = window.speechSynthesis.getVoices();
      const prefs = ['Microsoft Xiaoxiao','Xiaoxiao','Huihui','Microsoft Huihui','Google 普通话','Ting-Ting'];
      for (const name of prefs) {
        const v = voices.find(v => v.name.includes(name) && v.lang.startsWith('zh'));
        if (v) { currentUtter.voice = v; break; }
      }
      // 立即调用 speak——这是关键！必须在同步代码中调用
      window.speechSynthesis.speak(currentUtter);
    } catch(e) { currentUtter = null; }
  }

  try {
    const resp = await fetch(`${API_BASE}/api/ask?question=${encodeURIComponent(text)}`);
    const data = await resp.json();
    loading.remove();

    if (data.success && data.answer) {
      const botDiv = addChatMsg(data.answer, 'bot');

      if (data.source) {
        const tag = document.createElement('span');
        tag.className = 'source-tag';
        tag.textContent = '📎 ' + data.source;
        botDiv.appendChild(tag);
      }

      // 菜单/澄清类型 → 显示可点击按钮（不需要语音播报）
      if ((data.type === 'menu' || data.type === 'clarify') && data.menu_items && data.menu_items.length) {
        const menuDiv = document.createElement('div');
        menuDiv.className = 'chat-menu-options';
        for (const item of data.menu_items) {
          const btn = document.createElement('button');
          btn.className = 'chat-menu-btn';
          btn.textContent = item.label;
          btn.addEventListener('click', () => {
            const sendText = item.key ? `__ENTRY__:${item.key}:${item.label}` : item.label;
            userInput.value = sendText;
            sendMsg();
          });
          menuDiv.appendChild(btn);
        }
        botDiv.appendChild(menuDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        // 菜单类型：取消语音，显示文字即可
        window.speechSynthesis.cancel();
        currentUtter = null;
        bubbleLeft.textContent = data.answer.split('\n')[0];
        bubbleRight.textContent = '';
        bubbleLeft.classList.add('visible');
        return;
      }

      // ===== 详情类型：用实际内容替换占位语音 =====
      if (data.type === 'detail' && currentUtter) {
        // 修改占位语音的文本为实际答案
        currentUtter.text = data.answer;
        // 重新设置语音（确保 voices 已加载）
        const voices = window.speechSynthesis.getVoices();
        const prefs = ['Microsoft Xiaoxiao','Xiaoxiao','Huihui','Microsoft Huihui','Google 普通话','Ting-Ting'];
        for (const name of prefs) {
          const v = voices.find(v => v.name.includes(name) && v.lang.startsWith('zh'));
          if (v) { currentUtter.voice = v; break; }
        }
        
        let handled = false;
        // 设置 onend 回调："正在查询"播完后自动播放实际答案
        currentUtter.onend = () => {
          if (!handled) {
            handled = true;
            // 此时在手势上下文中（因为是连续播放）
            speakAndShow(data.answer, currentUtter);
            currentUtter = null;
          }
        };
        currentUtter.onerror = () => {
          if (!handled) {
            handled = true;
            window.speechSynthesis.cancel();
            speakAndShow(data.answer);
            currentUtter = null;
          }
        };
        // 兜底：150ms 后如果 onend 还没触发，说明占位语音已经播完了
        // 直接用新对象播放（此时已不在手势上下文，手机上可能失败，但至少文字能显示）
        setTimeout(() => {
          if (!handled) {
            handled = true;
            window.speechSynthesis.cancel();
            speakAndShow(data.answer);
            currentUtter = null;
          }
        }, 150);
      } else {
        // 非 detail 类型或 currentUtter 为空，直接播放
        window.speechSynthesis.cancel();
        speakAndShow(data.answer);
        currentUtter = null;
      }

    } else {
      addChatMsg('抱歉，未找到相关信息。', 'bot');
      window.speechSynthesis.cancel();
      currentUtter = null;
    }
  } catch (err) {
    loading.remove();
    addChatMsg('网络连接失败，请稍后重试。', 'bot');
    window.speechSynthesis.cancel();
    currentUtter = null;
  }
}

function addChatMsg(text, type) {
  const div = document.createElement('div');
  div.className = 'message ' + type;
  div.textContent = text;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  return div;
}

// ===== 事件绑定 =====
btnSend.addEventListener('click', sendMsg);
userInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });
window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

initRecognition();
</script>
